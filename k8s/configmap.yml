apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: app-namespace

data:
  POSTGRES_USER: "saas_user"
  POSTGRES_DB: "saas_platform"
  POSTGRES_HOST: "postgres"        # k8s Service name, not host.docker.internal
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis-service"
  ALLOWED_HOSTS: "myapp.local,backend-service,localhost,127.0.0.1"
  CORS_ALLOWED_ORIGINS: "http://myapp.local"
  DEBUG: "False"

---
apiVersion: v1
kind: Secret
metadata: 
  name: app-secret
  namespace: app-namespace

type: Opaque
stringData:
  POSTGRES_PASSWORD: "db"
  SECRET_KEY: "saas-secret-key"
  JWT_SECRET: "saas-jwt-secret"